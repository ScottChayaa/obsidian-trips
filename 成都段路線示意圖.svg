<svg xmlns="http://www.w3.org/2000/svg" width="840" height="660" viewBox="0 0 840 660" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif">
  <title>成都段移動路線示意圖</title>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d12f2f"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="840" height="660" fill="#f6f4ec"/>
  <ellipse cx="430" cy="310" rx="150" ry="120" fill="#e7ecdd" opacity="0.6"/>
  <ellipse cx="346" cy="485" rx="120" ry="90" fill="#e3eadf" opacity="0.5"/>
  <ellipse cx="790" cy="476" rx="110" ry="75" fill="#e3eadf" opacity="0.4"/>
  <text x="40" y="46" font-size="30" font-weight="bold" fill="#333">成都段移動路線示意圖</text>
  <text x="42" y="72" font-size="14" fill="#777">示意圖（節點按直線距離比例）｜紅線＝行車路線＋距離／時間｜上方為北</text>

  <!-- 指北針 -->
  <g transform="translate(775,66)">
    <circle r="18" fill="#ffffff" stroke="#555" stroke-width="1.6"/>
    <path d="M0,-12 L0,12" stroke="#c9c9c9" stroke-width="1.1"/>
    <path d="M0,-12 L-3.5,-4.5 L0,-1 L3.5,-4.5 Z" fill="#d12f2f"/>
    <text x="0" y="5" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">北</text>
  </g>

  <!-- ========== 路線（按實際方位與距離比例） ========== -->
  <!-- Day2 成都→都江堰（西北 約55km 直線） -->
  <line x1="430" y1="310" x2="367" y2="238" stroke="#d12f2f" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <!-- 都江堰→青城山（南 約11km） -->
  <line x1="367" y1="238" x2="356" y2="255" stroke="#d12f2f" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <!-- Day2 回程：青城山→芙蓉古鎮（東南）→成都（紅虛線） -->
  <line x1="356" y1="255" x2="405" y2="300" stroke="#d12f2f" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="405" y1="300" x2="430" y2="310" stroke="#d12f2f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/>
  <!-- Day3 成都→峨眉山（西南 約130km 直線） -->
  <line x1="430" y1="310" x2="346" y2="485" stroke="#d12f2f" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <!-- Day4 峨眉山→樂山大佛（東 約26km） -->
  <line x1="346" y1="485" x2="388" y2="480" stroke="#d12f2f" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <!-- Day4 樂山→成都（東北 約127km） -->
  <line x1="388" y1="480" x2="430" y2="310" stroke="#d12f2f" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <!-- Day5 早市：成都→青白江花鳥市場（東北 約29km 直線） -->
  <line x1="430" y1="310" x2="463" y2="266" stroke="#d12f2f" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  <!-- Day5 早市回程：青白江→成都（紅虛線） -->
  <line x1="463" y1="266" x2="430" y2="310" stroke="#d12f2f" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- 備選：青白江→三星堆（北 約12km，灰虛線） -->
  <line x1="463" y1="266" x2="465" y2="248" stroke="#8a8a8a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <!-- Day5 成都→重慶（灰虛線，約267km 後續段） -->
  <line x1="430" y1="310" x2="790" y2="476" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrowGray)"/>

  <!-- ========== 距離/時間標籤 ========== -->
  <!-- 成都→都江堰 -->
  <g>
    <rect x="150" y="178" width="170" height="42" rx="6" fill="#ffffff" stroke="#d12f2f" stroke-width="1.5"/>
    <text x="160" y="195" font-size="13" font-weight="bold" fill="#d12f2f">Day2 成都→都江堰</text>
    <text x="160" y="212" font-size="12" fill="#444">60km｜自駕約1h10m</text>
  </g>
  <!-- 都江堰→青城山 + 回程 -->
  <g>
    <rect x="150" y="262" width="186" height="42" rx="6" fill="#ffffff" stroke="#d12f2f" stroke-width="1.2"/>
    <text x="160" y="279" font-size="12" fill="#444">都江堰→青城山 15km｜約25m</text>
    <text x="160" y="296" font-size="12" fill="#444">回程順路:芙蓉古鎮→成都 約30–40m</text>
  </g>
  <!-- Day5 早市 + 三星堆備選 -->
  <g>
    <rect x="470" y="150" width="206" height="58" rx="6" fill="#ffffff" stroke="#d12f2f" stroke-width="1.5"/>
    <text x="480" y="167" font-size="13" font-weight="bold" fill="#d12f2f">Day5 早市:青白江花鳥市場</text>
    <text x="480" y="184" font-size="12" fill="#444">約30–40m｜週三・週日趕場</text>
    <text x="480" y="200" font-size="12" fill="#666">備選(室內):三星堆博物館 約1h</text>
  </g>
  <!-- 成都→峨眉山 -->
  <g>
    <rect x="180" y="505" width="170" height="42" rx="6" fill="#ffffff" stroke="#d12f2f" stroke-width="1.5"/>
    <text x="190" y="522" font-size="13" font-weight="bold" fill="#d12f2f">Day3 成都→峨眉山</text>
    <text x="190" y="539" font-size="12" fill="#444">160km｜包車約2h</text>
  </g>
  <!-- 峨眉山→樂山 + 樂山→成都 -->
  <g>
    <rect x="400" y="505" width="178" height="42" rx="6" fill="#ffffff" stroke="#d12f2f" stroke-width="1.2"/>
    <text x="410" y="522" font-size="12" fill="#444">峨眉山→樂山 40km｜45m-1h</text>
    <text x="410" y="539" font-size="12" fill="#444">樂山→成都 147km｜約2h</text>
  </g>
  <!-- 成都→重慶 -->
  <g>
    <rect x="590" y="462" width="160" height="42" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="600" y="479" font-size="13" font-weight="bold" fill="#666">Day5 成都→重慶</text>
    <text x="600" y="496" font-size="12" fill="#666">高鐵 約1h15m</text>
  </g>

  <!-- ========== 城市節點 ========== -->
  <!-- 成都（中心樞紐） -->
  <circle cx="430" cy="310" r="9" fill="#d12f2f" stroke="#fff" stroke-width="2"/>
  <text x="438" y="302" font-size="16" font-weight="bold" fill="#333" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">成都</text>
  <!-- 都江堰 -->
  <circle cx="367" cy="238" r="7" fill="#fff" stroke="#d12f2f" stroke-width="2.5"/>
  <text x="348" y="226" font-size="14" font-weight="bold" fill="#333" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">都江堰</text>
  <!-- 青城山 -->
  <circle cx="356" cy="255" r="7" fill="#fff" stroke="#d12f2f" stroke-width="2.5"/>
  <text x="300" y="250" font-size="14" font-weight="bold" fill="#333" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">青城山</text>
  <!-- 芙蓉古鎮（回程順路） -->
  <circle cx="405" cy="300" r="5.5" fill="#fff" stroke="#d12f2f" stroke-width="2"/>
  <text x="398" y="298" font-size="12" font-weight="bold" fill="#333" text-anchor="end" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">芙蓉古鎮</text>
  <!-- 青白江花鳥市場（Day5 早市） -->
  <circle cx="463" cy="266" r="6.5" fill="#d12f2f" stroke="#fff" stroke-width="2"/>
  <text x="472" y="290" font-size="12.5" font-weight="bold" fill="#333" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">青白江花鳥市場</text>
  <!-- 三星堆博物館（備選・室內） -->
  <circle cx="465" cy="248" r="5" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
  <text x="474" y="241" font-size="11.5" fill="#666" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">三星堆（備選）</text>
  <!-- 峨眉山 -->
  <circle cx="346" cy="485" r="7" fill="#fff" stroke="#d12f2f" stroke-width="2.5"/>
  <text x="286" y="478" font-size="14" font-weight="bold" fill="#333" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">峨眉山</text>
  <!-- 樂山大佛 -->
  <circle cx="388" cy="480" r="7" fill="#fff" stroke="#d12f2f" stroke-width="2.5"/>
  <text x="396" y="470" font-size="14" font-weight="bold" fill="#333" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">樂山大佛</text>
  <!-- 重慶 -->
  <circle cx="790" cy="476" r="8" fill="#8a8a8a" stroke="#fff" stroke-width="2"/>
  <text x="798" y="468" font-size="14" font-weight="bold" fill="#666" stroke="#f6f4ec" stroke-width="4" paint-order="stroke">重慶</text>

  <!-- 圖例 -->
  <g transform="translate(40,600)">
    <line x1="0" y1="8" x2="40" y2="8" stroke="#d12f2f" stroke-width="3"/>
    <text x="48" y="13" font-size="12" fill="#444">行車路線（Day2-5 成都周邊）</text>
    <line x1="238" y1="8" x2="278" y2="8" stroke="#d12f2f" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="286" y="13" font-size="12" fill="#444">回程</text>
    <line x1="368" y1="8" x2="408" y2="8" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="416" y="13" font-size="12" fill="#666">後續段／備選（成都→重慶、三星堆）</text>
  </g>
</svg>
